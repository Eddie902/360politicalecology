# ============================================================
# 360 POLITICAL ECOLOGY (360PE)
# Automated Quarto Website Build
#
# Website: https://360politicalecology.org
# ============================================================

name: Render Quarto website

on:
  push:
    branches:
      - main
    paths-ignore:
      - "_site/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Build and Validate 360PE Website
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # STEP 1: CHECK OUT WEBSITE SOURCE CODE
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ------------------------------------------------------
      # STEP 2: INSTALL QUARTO
      # ------------------------------------------------------

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # ------------------------------------------------------
      # STEP 3: INSTALL YAML VALIDATION DEPENDENCY
      # ------------------------------------------------------

      - name: Install YAML validator
        run: |
          python -m pip install PyYAML

      # ------------------------------------------------------
      # STEP 4: VALIDATE QUARTO CONFIGURATION
      # ------------------------------------------------------

      - name: Validate Quarto YAML
        shell: bash
        run: |
          python - <<'PYVALID'
          import yaml
          from pathlib import Path

          class UniqueLoader(yaml.SafeLoader):
              pass

          def no_duplicates(loader, node):
              mapping = {}

              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node)

                  if key in mapping:
                      raise ValueError(
                          f"Duplicate YAML configuration key: {key}"
                      )

                  mapping[key] = loader.construct_object(
                      value_node,
                      deep=True
                  )

              return mapping

          UniqueLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              no_duplicates
          )

          config_file = Path("_quarto.yml")

          if not config_file.exists():
              raise FileNotFoundError(
                  "Missing _quarto.yml configuration file"
              )

          with config_file.open(encoding="utf-8") as f:
              data = yaml.load(f, Loader=UniqueLoader)

          if not isinstance(data, dict):
              raise ValueError(
                  "Quarto configuration must be a YAML mapping"
              )

          project = data.get("project", {})

          if not isinstance(project, dict):
              raise ValueError(
                  "Invalid Quarto project configuration"
              )

          if project.get("type") != "website":
              raise ValueError(
                  "Quarto project type must be 'website'"
              )

          website = data.get("website")

          if not isinstance(website, dict):
              raise ValueError(
                  "Missing or invalid website configuration"
              )

          print(
              "SUCCESS: Quarto YAML is valid "
              "and contains no duplicate keys."
          )
          PYVALID

      # ------------------------------------------------------
      # STEP 5: RENDER QUARTO WEBSITE
      # ------------------------------------------------------

      - name: Render HTML
        shell: bash
        run: |
          set -euo pipefail
          quarto render

      # ------------------------------------------------------
      # STEP 6: VALIDATE GENERATED WEBSITE
      # ------------------------------------------------------

      - name: Check generated website files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking homepage..."
          test -f "_site/index.html"

          echo "Checking inaugural article..."
          test -f "_site/articles/africa-battery-minerals/index.html"

          echo "Checking official 360PE logo..."
          test -f "_site/images/360pe-logo.png"

          echo "Checking website stylesheet..."
          test -f "_site/styles.css"

          echo "Checking article evidence section..."
          grep -qi "Key sources and direct links" "_site/articles/africa-battery-minerals/index.html"

          echo "Checking for unresolved Git conflicts..."

          if grep -rEl \
            --include='*.html' \
            --include='*.css' \
            '^(<<<<<<< |=======|>>>>>>> )' \
            _site; then

            echo "ERROR: Unresolved Git conflict markers found."
            exit 1

          fi

          echo "SUCCESS: Essential website files verified."

      # ------------------------------------------------------
      # STEP 7: COMMIT GENERATED HTML WEBSITE
      # ------------------------------------------------------

      - name: Commit rendered website
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f _site

          if ! git diff --cached --quiet; then

            git commit -m "Build website HTML"

            git push origin HEAD:main

          else

            echo "No changes to generated website."

          fi