project:
  type: website
  output-dir: _site
  resources:
    - "articles/**/*.pdf"
    - "articles/**/*.docx"
    - "images/**"

website:
  title: "360 Political Ecology"
  site-url: "https://360politicalecology.org"
  description: >
    Independent, research-informed analysis of climate change, environmental
    justice, energy and resource economics, sustainability and development.
  navbar:
    logo: "images/360pe-logo.png"
    logo-alt: "360 Political Ecology logo"
    background: "#07394b"
    foreground: "#ffffff"
    left:
      - text: "Home"
        href: index.qmd
      - text: "360PE Review"
        href: publications.qmd
      - text: "Research & Data"
        href: research.qmd
      - text: "Topics"
        href: topics.qmd
      - text: "About"
        href: about.qmd
      - text: "Contact"
        href: contact.qmd
  search: true
  page-footer:
    border: true
    left: "© 360 Political Ecology · Evidence. Ecology. Equity. Development."
    right:
      - text: "Editorial Standards"
        href: editorial-standards.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    link-external-newwindow: true

editor: visual
